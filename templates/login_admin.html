
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - E-Vote Mahasiswa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .pesan {
            padding: 10px;
            margin-bottom: 15px;
            background: #334155;
            border-radius: 6px;
        }

        .kembali {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>LOGIN ADMIN</h2>
        <p>E-VOTE MAHASISWA</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="pesan">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Masukkan username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Masukkan password"
                required
            >

            <button type="submit">
                LOGIN ADMIN
            </button>

        </form>

        <a href="/" class="kembali">
            Kembali ke halaman utama
        </a>

    </div>

</body>
</html>
